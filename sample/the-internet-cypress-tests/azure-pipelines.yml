# Generated by Suite Builder for https://the-internet.herokuapp.com. EDIT RULES: edit only inside YOURS blocks; regenerating keeps them and rewrites the rest of this file.
# Azure Pipelines: on every push and pull request, the quick check (http and smoke, in chromium): a site
# that is down or a page type that no longer opens fails in a minute or two. Each night, and when
# started by hand, every test, once in each of chromium and firefox. The results and any failure's
# evidence are kept with each run. Another copy of the site (a staging server): set BASE_URL.
# BASE_URL: a pipeline variable.
trigger:
  branches:
    include: ['*']
pr:
  branches:
    include: ['*']
schedules:
  - cron: '23 3 * * *'
    displayName: Nightly
    branches:
      include: [main]
    always: true
pool:
  vmImage: ubuntu-latest
jobs:
  - job: quick
    condition: and(ne(variables['Build.Reason'], 'Schedule'), ne(variables['Build.Reason'], 'Manual'))
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: '20.x'
      - script: npm install
      - script: npm test -- --spec cypress/e2e/cases/links.cy.ts,cypress/e2e/cases/smoke.cy.ts --browser chrome --reporter junit --reporter-options "mochaFile=cypress/results/[hash].xml"
      - task: PublishTestResults@2
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: 'cypress/results/*.xml'
      - task: PublishPipelineArtifact@1
        condition: succeededOrFailed()
        inputs:
          targetPath: cypress/report.html
          artifact: report-quick
      - task: PublishPipelineArtifact@1
        condition: failed()
        inputs:
          targetPath: cypress/failures
          artifact: quick
  - job: full
    condition: in(variables['Build.Reason'], 'Schedule', 'Manual')
    strategy:
      matrix:
        chromium:
          BROWSER: chrome
        firefox:
          BROWSER: firefox
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: '20.x'
      - script: npm install
      - script: npm test -- --browser $(BROWSER) --reporter junit --reporter-options "mochaFile=cypress/results/[hash].xml"
      - task: PublishTestResults@2
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: 'cypress/results/*.xml'
      - task: PublishPipelineArtifact@1
        condition: succeededOrFailed()
        inputs:
          targetPath: cypress/report.html
          artifact: report-full-$(BROWSER)
      - task: PublishPipelineArtifact@1
        condition: failed()
        inputs:
          targetPath: cypress/failures
          artifact: full-$(BROWSER)
  # ==== YOURS (jobs): safe to edit; regenerating keeps what is between these lines ====
  # ==== END YOURS (jobs) ====
