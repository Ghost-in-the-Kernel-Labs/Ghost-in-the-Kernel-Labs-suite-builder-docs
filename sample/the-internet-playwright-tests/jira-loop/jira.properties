# Generated by Suite Builder. EDIT RULES: this whole file is yours. Suite Builder wrote it once and never overwrites it.
# The Jira loop (jira-loop/README.md). Typed in the suite's folder, jira login fills this in: it asks
# for the address and a token, and offers the project and its statuses to choose from. Or fill in site and
# project by hand, and check the status names: jira status says whether each is reachable. ready may
# name several statuses, separated by commas (jira watch ticks them). No secret is written here: the token is in secrets/jira.login (never
# committed) on a person's computer, and JIRA_API_TOKEN (and JIRA_EMAIL on Cloud) in a pipeline's secrets.

# Your Jira's address, as https://your-company.atlassian.net
site =
# cloud (atlassian.net) or data-center (your company's own server)
edition = cloud
# The project's key: the letters before the dash in its issues' keys (ENG in ENG-12)
project =
# The four flags (statuses), as your Jira names them; jira login offers them to choose from.
# 1. The status a BA moves a story to when it is ready for the suite (the watch flag; several: commas)
ready = Ready for QA Development
# 2. Where jira pull moves a card it takes, so no one else takes it (blank: the card stays where it is).
#    Add such a status to the workflow (reachable from ready) to use it: QA Automation, say.
claimed =
# 3. Where a story goes back to when it is pushed back, or a criterion waits on an answer
triage = BA Triage
# 4. Where a story goes when every criterion has a test
implemented = Done
# The most stories taken in one run
max = 5
